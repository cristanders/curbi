<header class="app-topbar">
  <a routerLink="/home" class="app-brand" aria-label="CURBI home">
    <img [src]="brandUrl" alt="" width="28" height="28" />
    <span class="app-brand-name">CURBI</span>
  </a>

  <nav class="app-nav" aria-label="Main">
    <a routerLink="/home" class="app-nav-link" [class.is-active]="active === 'home'">Dashboard</a>
    <a routerLink="/wallet" class="app-nav-link" [class.is-active]="active === 'wallet'"
      >Wallet</a
    >
    <a routerLink="/saves" class="app-nav-link" [class.is-active]="active === 'saves'">Saves</a>
    <a routerLink="/transactions" class="app-nav-link" [class.is-active]="active === 'transactions'"
      >Transactions</a
    >
    <a routerLink="/learn" class="app-nav-link" [class.is-active]="active === 'learn'">Aprende</a>
  </nav>

  <a
    routerLink="/notifications"
    class="app-bell"
    [class.is-active]="active === 'notifications'"
    title="Notificaciones"
    aria-label="Notificaciones"
  >
    <span class="app-bell-icon" aria-hidden="true">🔔</span>
    @if (unread > 0) {
      <span class="app-bell-badge">{{ unread > 9 ? '9+' : unread }}</span>
    }
  </a>

  <a
    routerLink="/profile"
    class="app-avatar"
    [class.is-active]="active === 'profile'"
    title="Profile"
  >
    <img [src]="avatarUrl" alt="Profile" width="38" height="38" />
  </a>
</header>
